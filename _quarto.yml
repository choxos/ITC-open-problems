project:
  type: website
  output-dir: docs
  render:
    # A bare "*.qmd" is expanded to "**/*.qmd" by Quarto, so anchor it to root.
    - "/*.qmd"
    - "/categories/*.qmd"
    - "/problems/*.qmd"

website:
  title: "Open Problems in ITC & PAIC"
  description: "An audited catalog of open methodological problems in indirect treatment comparisons and population-adjusted indirect comparisons."
  site-url: https://choxos.github.io/ITC-open-problems/
  repo-url: https://github.com/choxos/ITC-open-problems
  repo-actions: [issue]
  search:
    location: navbar
    type: overlay
    copy-button: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: catalog.qmd
        text: Catalog
      - text: Categories
        menu:
          - categories/estimands.qmd
          - categories/identification.qmd
          - categories/qba.qmd
          - categories/overlap.qmd
          - categories/covariates.qmd
          - categories/model-specification.qmd
          - categories/heterogeneity.qmd
          - categories/disconnected.qmd
          - categories/component.qmd
          - categories/outcomes.qmd
          - categories/missing-data.qmd
          - categories/diagnostics.qmd
          - categories/computation.qmd
          - categories/decision.qmd
          - categories/evidence-base.qmd
          - categories/adjacent-methods.qmd
          - categories/software.qmd
      - href: agenda.qmd
        text: Agenda
      - href: landscape.qmd
        text: Landscape
      - href: methods.qmd
        text: How this was verified
      - href: references.qmd
        text: References
    right:
      - icon: github
        href: https://github.com/choxos/ITC-open-problems
        aria-label: GitHub repository
  page-footer:
    left: "Ahmad Sofi-Mahmudi"
    center: "Every entry carries a verification verdict. See [How this was verified](/methods.qmd)."
    right: "[Source](https://github.com/choxos/ITC-open-problems)"

bibliography: references.bib
csl: vancouver.csl
link-citations: true

format:
  html:
    # styles.scss carries the rules and must appear in BOTH lists: Quarto emits
    # one stylesheet per mode, so a rule listed only under light does not exist
    # in dark. The theme-*.scss files carry only per-mode variable values.
    theme:
      light: [cosmo, theme-light.scss, styles.scss]
      dark: [darkly, theme-dark.scss, styles.scss]
    toc: true
    toc-depth: 3
    toc-expand: true
    html-math-method: mathjax
    code-copy: true
    code-overflow: wrap
    callout-appearance: simple
    anchor-sections: true
    fig-responsive: true
    link-external-newwindow: true
    link-external-icon: false
